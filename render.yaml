services:
  - type: web
    name: class-register
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m py_compile server.py
    startCommand: python server.py
    plan: free
    envVars:
      - key: ATTENDANCE_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: class-register-db
          property: connectionString
databases:
  - name: class-register-db
    plan: free
